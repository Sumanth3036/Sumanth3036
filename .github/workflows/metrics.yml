name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Sumanth3036
          template: classic
          filename: github-metrics.svg
          output_action: commit
          committer_branch: main
          config_timezone: Asia/Kolkata

          base: header, activity, community, repositories, metadata
          base_indepth: yes

          # Habits: commit activity per hour / per day / language activity
          plugin_habits: yes
          plugin_habits_from: 100
          plugin_habits_days: 30
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_indepth: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Mastered technologies and topics (icon grid, built from your repo topics)
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_limit: 30

          # PageSpeed needs a free Google API key stored as secret PAGESPEED_TOKEN
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://sumanth3036.github.io/my-portfolio/
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
          plugin_pagespeed_detailed: no
