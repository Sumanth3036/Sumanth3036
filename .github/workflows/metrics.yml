name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"   # refresh every 6 hours
  workflow_dispatch:         # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Sumanth3036
          template: classic
          filename: github-metrics.svg
          output_action: commit
          committer_branch: main
          config_timezone: Asia/Kolkata

          # Header / profile card (left column + top of middle column)
          base: header, activity, community, repositories, metadata
          base_indepth: yes

          # Coding habits and recent activity (commit-per-hour, per-day, language activity)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_languages_limit: 8

          # Most used languages bar
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_indepth: yes

          # 3D contributions calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # PageSpeed Insights scores for your portfolio
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://sumanth3036.github.io/my-portfolio/
          plugin_pagespeed_detailed: no
